name: DAT535 — Dev Pipeline (OPDI project)

# Dev = sandbox. Every push to `dev` and every pull request is tested; then the whole pipeline runs layer by layer
# on a small sample (one 10-day window, config/dev.toml) in a separate folder (~/opdi-data-dev), so a bad run never
# touches prod data. A nightly run checks the source every day: thanks to the incremental Bronze it only rebuilds
# the files EUROCONTROL republished (GitHub runs schedules with the workflow and code of the default branch, main).

on:
  push:
    branches: [dev]
    paths: ["projet_opdi/**", ".github/workflows/dat535-dev.yml"]
  pull_request:
    branches: [dev, main]          # feature branch -> dev, and dev -> main (release)
    paths: ["projet_opdi/**", ".github/workflows/**"]
  schedule:
    - cron: "17 2 * * *"           # nightly at 02:17 UTC: new or republished source files -> Bronze -> Gold
  workflow_dispatch:
    inputs:
      start:
        description: "First day of the scope (YYYY-MM-DD, empty = dev default 2026-06-09)"
        required: false
      end:
        description: "End of the scope, exclusive (YYYY-MM-DD, empty = dev default 2026-06-19)"
        required: false
      full_refresh:
        description: "Rebuild every Bronze period, even the ones whose source file did not change"
        type: boolean
        default: false
      explore:
        description: "Only run the exploration of the arrival phase on the published dev tables (no pipeline run)"
        type: boolean
        default: false
      notebooks:
        description: "Only execute the showcase notebooks 02, 04, 05 on the published PROD tables (read-only) and upload them"
        type: boolean
        default: false

concurrency:                       # a new push cancels the dev run still in progress for the same branch
  group: dat535-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit and end-to-end tests
    if: ${{ !inputs.explore && !inputs.notebooks }}
    runs-on: ubuntu-latest         # GitHub-hosted: does not use the VM, works even when it is busy
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projet_opdi
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projet_opdi/requirements-test.txt

      - name: Set up Java (Spark 3.5)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests (config, ingestion, Silver rules, notebooks, whole pipeline on synthetic data)
        run: python -m pytest -v

  pipeline-dev:
    name: Run pipeline on the dev sample
    if: ${{ !inputs.explore && !inputs.notebooks }}
    needs: tests
    runs-on: self-hosted
    environment: dev
    timeout-minutes: 120
    defaults:
      run:
        shell: bash                # bash -eo pipefail: a failing layer fails its step, even through tee
    env:
      SPARK_HOME: /opt/spark
      JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64
      OPDI_RUN_ID: dev-${{ github.run_number }}-${{ github.run_attempt }}   # shared by the layers of this run
      OPDI_START: ${{ github.event.inputs.start }}   # empty = value of config/dev.toml
      OPDI_END: ${{ github.event.inputs.end }}
      OPDI_FULL_REFRESH: ${{ github.event.inputs.full_refresh }}   # empty/false = incremental Bronze
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare folders
        run: |
          echo "DATA=$HOME/opdi-data-dev" >> "$GITHUB_ENV"
          echo "LOGS=$HOME/opdi-data-dev/logs/$OPDI_RUN_ID" >> "$GITHUB_ENV"
          mkdir -p "$HOME/opdi-data-dev/logs/$OPDI_RUN_ID"
          # resources of the VM at the start of the run (memory / CPU / disk), kept in the log of the run
          { date -u; free -h; nproc; df -h "$HOME"; } | tee "$HOME/opdi-data-dev/logs/$OPDI_RUN_ID/0_resources.log"

      - name: "1/6 Ingest: download the OPDI and OurAirports files (raw/, manifest)"
        run: |
          source ~/spark-env/bin/activate
          python projet_opdi/run_pipeline.py --env dev --layer ingest 2>&1 | tee "$LOGS/1_ingest.log"

      - name: "2/6 Bronze: schema check, tables with lineage, reconciliation"
        run: |
          source ~/spark-env/bin/activate
          python projet_opdi/run_pipeline.py --env dev --layer bronze 2>&1 | tee "$LOGS/2_bronze.log"

      - name: "3/6 Silver: cleaning, quarantine, deduplication, enrichment, evidence"
        run: |
          source ~/spark-env/bin/activate
          python projet_opdi/run_pipeline.py --env dev --layer silver 2>&1 | tee "$LOGS/3_silver.log"

      - name: "4/6 Gold: airport operations, validation, publication"
        run: |
          source ~/spark-env/bin/activate
          python projet_opdi/run_pipeline.py --env dev --layer gold 2>&1 | tee "$LOGS/4_gold.log"

      - name: "5/6 ML: GBT arrival model, scenarios, airport typology"
        run: |
          source ~/spark-env/bin/activate
          python projet_opdi/run_pipeline.py --env dev --layer ml 2>&1 | tee "$LOGS/5_ml.log"

      - name: "6/6 Summary: quality gates of the run"
        if: always()               # also after a failure: the summary shows which gate failed
        run: |
          source ~/spark-env/bin/activate
          python projet_opdi/run_pipeline.py --env dev --layer summary 2>&1 | tee "$LOGS/6_summary.log"

      # Gold tables: a few MB, so they can be analysed without access to the VM
      - name: Upload logs, layer reports, quality results and Gold tables
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opdi-dev-run-${{ github.run_number }}
          path: |
            ${{ env.LOGS }}/
            ${{ env.DATA }}/reports/${{ env.OPDI_RUN_ID }}/
            ${{ env.DATA }}/pipeline_summary.json
            ${{ env.DATA }}/raw/manifest.csv
            ${{ env.DATA }}/raw/schema_report.csv
            ${{ env.DATA }}/gold/
          retention-days: 7
          if-no-files-found: warn

  explore:
    name: Explore the arrival phase (on demand)
    if: ${{ inputs.explore }}      # Run workflow -> tick "explore": reads the tables of the last dev run
    runs-on: self-hosted
    environment: dev
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      SPARK_HOME: /opt/spark
      JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64
      OPDI_RUN_ID: explore-${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare folders
        run: |
          echo "DATA=$HOME/opdi-data-dev" >> "$GITHUB_ENV"
          echo "LOGS=$HOME/opdi-data-dev/logs/$OPDI_RUN_ID" >> "$GITHUB_ENV"
          mkdir -p "$HOME/opdi-data-dev/logs/$OPDI_RUN_ID"
          # resources of the VM at the start of the run (memory / CPU / disk), kept in the log of the run
          { date -u; free -h; nproc; df -h "$HOME"; } | tee "$HOME/opdi-data-dev/logs/$OPDI_RUN_ID/0_resources.log"

      - name: Explore measurements, descent milestones, level segments
        run: |
          source ~/spark-env/bin/activate
          python projet_opdi/run_pipeline.py --env dev --layer explore 2>&1 | tee "$LOGS/explore.log"

      - name: Upload the exploration report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opdi-dev-explore-${{ github.run_number }}
          path: |
            ${{ env.LOGS }}/
            ${{ env.DATA }}/reports/${{ env.OPDI_RUN_ID }}/
          retention-days: 7
          if-no-files-found: warn

  notebooks:
    name: Execute the showcase notebooks (on demand)
    if: ${{ inputs.notebooks }}    # Run workflow -> tick "notebooks": the VM's Jupyter is only reachable on campus
    runs-on: self-hosted
    environment: dev
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      SPARK_HOME: /opt/spark
      JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Execute notebooks 02, 04 and 05 (they only read ~/opdi-data; figures go to projet_opdi/docs/figures)
        run: |
          source ~/spark-env/bin/activate
          OUT="$RUNNER_TEMP/notebooks"
          mkdir -p "$OUT"
          cd projet_opdi/notebooks
          status=0
          for nb in 02_pipeline_walkthrough 04_gold_dashboard 05_arrival_efficiency; do
            echo "::group::$nb"
            if ! jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=1800 \
                   --output-dir "$OUT" "$nb.ipynb" > "$OUT/$nb.log" 2>&1; then
              echo "::error::$nb failed (see $nb.log in the artifact)"
              status=1
            fi
            tail -5 "$OUT/$nb.log"
            echo "::endgroup::"
          done
          cp -r ../docs/figures "$OUT/figures" 2>/dev/null || echo "no figure exported"
          exit $status

      - name: Upload the executed notebooks and the figures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opdi-notebooks-${{ github.run_number }}
          path: ${{ runner.temp }}/notebooks/
          retention-days: 7
          if-no-files-found: warn
