name: DAT535 — Production Pipeline (OPDI project)

# Prod = the trusted version. Runs after a merge into `main` and once a month, only after a reviewer approves the
# deployment (GitHub environment `main`), on the full scope (config/prod.toml) in ~/opdi-data.

on:
  push:
    branches: [main]
    paths: ["projet_opdi/**", ".github/workflows/dat535-prod.yml"]
  schedule:
    - cron: "0 3 1 * *"            # monthly, 1st of the month at 03:00 UTC (republished files, re-validation)
  workflow_dispatch:
    inputs:
      start:
        description: "First day of the scope (YYYY-MM-DD, empty = 2026-06-01)"
        required: false
      end:
        description: "End of the scope, exclusive (YYYY-MM-DD, empty = 2026-07-29)"
        required: false
      full_refresh:
        description: "Rebuild every Bronze period, even the ones whose source file did not change"
        type: boolean
        default: false

concurrency:                       # never two prod runs at the same time on the same data
  group: dat535-prod
  cancel-in-progress: false

jobs:
  tests:
    name: Unit and end-to-end tests
    runs-on: ubuntu-latest         # GitHub-hosted: does not use the VM, works even when it is busy
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projet_opdi
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projet_opdi/requirements-test.txt

      - name: Set up Java (Spark 3.5)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests (config, ingestion, Silver rules, notebooks, whole pipeline on synthetic data)
        run: python -m pytest -v

  pipeline-prod:
    name: Deploy to production (full scope)
    needs: tests
    runs-on: self-hosted
    environment: main              # required reviewer: the run waits for a manual approval
    timeout-minutes: 360
    defaults:
      run:
        shell: bash                # bash -eo pipefail: a failing layer fails its step, even through tee
    env:
      SPARK_HOME: /opt/spark
      JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64
      OPDI_RUN_ID: prod-${{ github.run_number }}-${{ github.run_attempt }}   # shared by the layers of this run
      OPDI_START: ${{ github.event.inputs.start }}   # empty = value of config/prod.toml
      OPDI_END: ${{ github.event.inputs.end }}
      OPDI_FULL_REFRESH: ${{ github.event.inputs.full_refresh }}   # empty/false = incremental Bronze
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare folders
        run: |
          echo "DATA=$HOME/opdi-data" >> "$GITHUB_ENV"
          echo "LOGS=$HOME/opdi-data/logs/$OPDI_RUN_ID" >> "$GITHUB_ENV"
          mkdir -p "$HOME/opdi-data/logs/$OPDI_RUN_ID"

      - name: "1/5 Ingest: download the OPDI and OurAirports files (raw/, manifest)"
        run: |
          source ~/spark-env/bin/activate
          python projet_opdi/run_pipeline.py --env prod --layer ingest 2>&1 | tee "$LOGS/1_ingest.log"

      - name: "2/5 Bronze: schema check, tables with lineage, reconciliation"
        run: |
          source ~/spark-env/bin/activate
          python projet_opdi/run_pipeline.py --env prod --layer bronze 2>&1 | tee "$LOGS/2_bronze.log"

      - name: "3/5 Silver: cleaning, quarantine, deduplication, enrichment, evidence"
        run: |
          source ~/spark-env/bin/activate
          python projet_opdi/run_pipeline.py --env prod --layer silver 2>&1 | tee "$LOGS/3_silver.log"

      - name: "4/5 Gold: airport operations, validation, publication"
        run: |
          source ~/spark-env/bin/activate
          python projet_opdi/run_pipeline.py --env prod --layer gold 2>&1 | tee "$LOGS/4_gold.log"

      - name: "5/5 Summary: quality gates of the run"
        if: always()               # also after a failure: the summary shows which gate failed
        run: |
          source ~/spark-env/bin/activate
          python projet_opdi/run_pipeline.py --env prod --layer summary 2>&1 | tee "$LOGS/5_summary.log"

      # Gold tables: a few MB, so they can be analysed without access to the VM
      - name: Upload logs, layer reports, quality results and Gold tables
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opdi-prod-run-${{ github.run_number }}
          path: |
            ${{ env.LOGS }}/
            ${{ env.DATA }}/reports/${{ env.OPDI_RUN_ID }}/
            ${{ env.DATA }}/pipeline_summary.json
            ${{ env.DATA }}/raw/manifest.csv
            ${{ env.DATA }}/raw/schema_report.csv
            ${{ env.DATA }}/gold/
          retention-days: 30
          if-no-files-found: warn
