name: DAT535 — Dev Pipeline (OPDI project)

# Dev = sandbox: every push to `dev` is tested, then the whole pipeline runs on a small sample
# (one 10-day window) in a separate data folder (~/opdi-data-dev), so a bad run never touches prod data.

on:
  push:
    branches: [dev]
    paths: ["projet_opdi/**", ".github/workflows/dat535-dev.yml"]
  pull_request:
    branches: [main]
    paths: ["projet_opdi/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      start:
        description: "First day of the scope (YYYY-MM-DD, empty = dev default 2026-06-09)"
        required: false
      end:
        description: "End of the scope, exclusive (YYYY-MM-DD, empty = dev default 2026-06-19)"
        required: false

concurrency:                       # a new push cancels the dev run still in progress for the same branch
  group: dat535-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit and end-to-end tests
    runs-on: ubuntu-latest         # GitHub-hosted: does not use the VM, works even when it is busy
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projet_opdi
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projet_opdi/requirements-test.txt

      - name: Set up Java (Spark 3.5)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests (ingestion, Silver rules, whole notebook on synthetic data)
        run: python -m pytest -v

  pipeline-dev:
    name: Run pipeline on the dev sample
    needs: tests
    runs-on: self-hosted
    environment: dev
    timeout-minutes: 120
    env:
      SPARK_HOME: /opt/spark
      JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve folders
        id: dirs
        run: |
          echo "data=$HOME/opdi-data-dev" >> "$GITHUB_OUTPUT"
          echo "report=$HOME/opdi-data-dev/reports/run-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Check notebook runner dependencies
        run: |
          source ~/spark-env/bin/activate
          python -c "import nbclient, nbconvert, ipykernel, findspark" 2>/dev/null \
            || pip install --quiet nbclient nbconvert ipykernel findspark

      - name: Run the pipeline notebook (dev)
        run: |
          source ~/spark-env/bin/activate
          python projet_opdi/run_project.py --env dev \
            ${{ github.event.inputs.start && format('--start {0}', github.event.inputs.start) || '' }} \
            ${{ github.event.inputs.end && format('--end {0}', github.event.inputs.end) || '' }} \
            --report-dir "${{ steps.dirs.outputs.report }}"

      - name: Upload run report and quality results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opdi-dev-run-${{ github.run_number }}
          path: |
            ${{ steps.dirs.outputs.report }}/
            ${{ steps.dirs.outputs.data }}/pipeline_summary.json
            ${{ steps.dirs.outputs.data }}/raw/manifest.csv
            ${{ steps.dirs.outputs.data }}/raw/schema_report.csv
          retention-days: 7
          if-no-files-found: warn
